# Live nginx vhost for givsiatech.com, copied from
# /etc/nginx/sites-available/givsiatech on the VPS (200.141.3.20).
#
# This file is NOT read by nginx or by the deploy workflow — it's a
# disaster-recovery reference only, since nginx lives on the host outside
# docker-compose.yml (see the comment there) and nothing in this repo
# previously tracked it.
#
# To restore from scratch on a fresh VPS:
#   1. Install nginx + certbot: apt install nginx certbot python3-certbot-nginx
#   2. Copy the `location` blocks below into /etc/nginx/sites-available/givsiatech,
#      symlink into sites-enabled, `nginx -t && systemctl reload nginx`
#   3. Run: certbot --nginx -d givsiatech.com -d www.givsiatech.com --redirect
#      (this issues the Let's Encrypt cert and auto-adds the `listen 443 ssl`
#      block + the http->https redirect server block — the "# managed by
#      Certbot" lines below are what certbot generates automatically, don't
#      hand-write them)
#
# Incident note (2026-07-24): the site was live on port 80 only — certbot had
# never been run on this VPS, so port 443 had nothing listening. The frontend
# is built with VITE_API_URL=https://givsiatech.com/api (see
# .github/workflows/deploy.yml), so every /api/* call timed out even though
# the page itself loaded fine over plain HTTP. Fixed by running the certbot
# command above; nothing in the application code or deploy workflow was at
# fault.

server {
    server_name givsiatech.com www.givsiatech.com;

    root /var/www/givsiatech/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
    }

    location / {
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/givsiatech.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/givsiatech.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.givsiatech.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = givsiatech.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name givsiatech.com www.givsiatech.com;
    return 404; # managed by Certbot
}
